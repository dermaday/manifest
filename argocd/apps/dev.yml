apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dermaday-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:dermaday/manifest.git
    targetRevision: main
    path: dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - FailOnSharedResource=true
