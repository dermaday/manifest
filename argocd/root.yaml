apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dermaday-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:dermaday/manifest.git
    targetRevision: main
    path: argocd/apps

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - ApplyOutOfSyncOnly=true